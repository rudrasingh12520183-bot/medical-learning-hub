<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Caduceus / Medical Shield Outline in Safe Zone (80% diameter) -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Base Glow Circle -->
    <circle r="150" fill="white" fill-opacity="0.08" />
    
    <!-- Open Textbook base -->
    <path d="M-110,60 C-60,35 -20,50 0,65 C20,50 60,35 110,60 L110,120 C60,95 20,110 0,125 C-20,110 -60,95 -110,120 Z" fill="#ffffff" fill-opacity="0.95" />
    <path d="M0,65 L0,125" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />

    <!-- Medical Cross -->
    <rect x="-26" y="-120" width="52" height="150" rx="16" fill="url(#crossGrad)" />
    <rect x="-75" y="-71" width="150" height="52" rx="16" fill="url(#crossGrad)" />
    <circle cx="0" cy="-45" r="16" fill="#ffffff" />
    
    <!-- Stethoscope Arch Accent -->
    <path d="M-90,-10 C-110,40 -70,90 -30,95" fill="none" stroke="#f0f9ff" stroke-width="12" stroke-linecap="round" />
    <path d="M90,-10 C110,40 70,90 30,95" fill="none" stroke="#f0f9ff" stroke-width="12" stroke-linecap="round" />
    <circle cx="-90" cy="-15" r="12" fill="#38bdf8" />
    <circle cx="90" cy="-15" r="12" fill="#38bdf8" />
  </g>
</svg>
